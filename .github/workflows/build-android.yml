name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Purge any local .glb 3D models before Capacitor sync
        run: |
          echo "Ensuring no .glb models are packaged locally into the APK bundle..."
          rm -f dist/*.glb dist/**/*.glb public/*.glb public/**/*.glb || true
          find dist/ -name "*.glb" -delete || true
          find public/ -name "*.glb" -delete || true

      - name: Sync web assets with Capacitor Android platform
        run: npx cap sync android

      - name: Strip any .glb files from Android assets before APK compilation
        run: |
          echo "Auditing android assets directory for .glb files..."
          find android/ -name "*.glb" -delete || true
          echo "Asset audit complete. Ready for Gradle build."

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Setup persistent signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'arenaxdebug' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'arenaxkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'arenaxdebug' }}
        run: |
          mkdir -p android/keystores
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding persistent signing keystore from GitHub secrets..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/keystores/signing.keystore
          else
            echo "SIGNING_KEYSTORE_BASE64 secret not yet set. Generating deterministic repository keystore..."
            keytool -genkey -v -keystore android/keystores/signing.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=ArenaX, OU=Esports, O=ArenaX, C=PK"
          fi
          echo "DEBUG_STORE_FILE=../keystores/signing.keystore" >> android/gradle.properties
          echo "DEBUG_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> android/gradle.properties
          echo "DEBUG_KEY_ALIAS=$KEY_ALIAS" >> android/gradle.properties
          echo "DEBUG_KEY_PASSWORD=$KEY_PASSWORD" >> android/gradle.properties

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arenax-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
