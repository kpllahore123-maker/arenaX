<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArenaX — Redirecting...</title>
  <script>
      // GitHub Pages SPA router redirect for /reset-password, /discord-callback, and deep routes
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // If route is /reset-password, map token to ?resetToken for the SPA
        if (pathname.indexOf('reset-password') !== -1) {
          var params = new URLSearchParams(search);
          var token = params.get('resetToken') || params.get('token');
          if (token) {
            window.location.replace('/?resetToken=' + encodeURIComponent(token) + (hash ? hash : ''));
            return;
          }
        }
        
        // Preserve query params and redirect to root with parameters
        var targetUrl = '/' + (search ? search : '') + (hash ? hash : '');
        window.location.replace(targetUrl);
      })();
  </script>
</head>
<body style="background-color: #0c0d12; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
  <p>Redirecting to ArenaX...</p>
</body>
</html>
